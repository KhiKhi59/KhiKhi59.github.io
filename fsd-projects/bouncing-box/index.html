
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bouncing Box</title>
  <script src="jquery.min.js"></script>

  <style>
    .box {
      width: 70px;
      height: 70px;
      background-color: teal;
      font-size: 300%;
      text-align: center;
      user-select: none;
      display: block;
      position: absolute;
      top: 100px;
      left: 0px;
    }
  </style>
</head>

<body>

  <div class="box">0</div>

  <script>
    (function () {
      "use strict";

      var box = jQuery(".box");
      var boardWidth = jQuery(window).width() - 70;

      var positionX = 0;
      var speed = 5;
      var direction = 1;
      var points = 0;

      function moveBoxTo(newPositionX) {
        box.css("left", newPositionX);
      }

      function changeBoxText(newText) {
        box.text(newText);
      }

      jQuery(window).on("resize", function () {
        boardWidth = jQuery(window).width() - 70;
      });

      function update() {
        positionX += speed * direction;

        if (positionX >= boardWidth) {
          positionX = boardWidth;
          direction = -1;
        } else if (positionX <= 0) {
          positionX = 0;
          direction = 1;
        }

        moveBoxTo(positionX);
      }

      function handleBoxClick() {
        points++;
        speed += 2;
        positionX = 0;
        direction = 1;
        moveBoxTo(positionX);
        changeBoxText(points);
      }

      setInterval(update, 50);
      box.on("click", handleBoxClick);

    })();
  </script>

</body>
</html>
