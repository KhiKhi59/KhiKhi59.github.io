<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bouncing Box | Khi's Amazing Website</title>
  <script src="jquery.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 40px;
      background: #0b0d0f;
      color: #eef1f2;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    #all-contents {
      width: min(100%, 1500px);
      margin: 0 auto;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 48px;
      padding: 16px 24px;
      border: 1px solid #59656c;
      border-radius: 12px;
      background: #14181b;
    }

    nav h1 {
      margin: 0;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    #nav-ul {
      display: flex;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-li a {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 8px;
      color: #ddd;
      font-size: 0.85rem;
      text-decoration: none;
    }

    .nav-li a:hover,
    .nav-li a:focus-visible {
      background: #8b989e;
      color: #101315;
    }

    main {
      width: min(100%, 1100px);
      margin: 0 auto;
    }

    .game-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      margin-bottom: 24px;
    }

    .game-heading h2 {
      margin: 0;
      color: #fff;
      font-size: 2.5rem;
      line-height: 1;
      text-transform: uppercase;
    }

    .game-heading p {
      max-width: 360px;
      margin: 0;
      color: #c8d0d4;
      font-size: 1rem;
      line-height: 1.5;
    }

    .game-panel {
      overflow: hidden;
      border: 2px solid #59656c;
      border-radius: 12px;
      background: #14181b;
    }

    .scoreboard {
      display: flex;
      gap: 48px;
      padding: 18px 24px;
      border-bottom: 1px solid #59656c;
    }

    .stat-label {
      display: block;
      margin-bottom: 5px;
      color: #aeb8bd;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .stat-value {
      color: #8be0ff;
      font-size: 1.25rem;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .board {
      position: relative;
      height: 320px;
      overflow: hidden;
      background-color: #1b1f22;
      background-image: linear-gradient(#2a3034 1px, transparent 1px), linear-gradient(90deg, #2a3034 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .box {
      position: absolute;
    top: 0;
      left: 0;
      display: grid;
      width: 70px;
      height: 70px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 4px;
      background: #8be0ff;
      box-shadow: 4px 4px 0 #536d78;
      color: #101315;
      cursor: pointer;
      font: inherit;
      font-size: 1.5rem;
      font-weight: 800;
      user-select: none;
    }

    .box:hover {
      background: #b2ecff;
    }

    .box:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .game-footer {
      margin: 0;
      padding: 14px 24px;
      border-top: 1px solid #59656c;
      color: #c8d0d4;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      body {
        padding: 20px 16px;
      }

      nav {
        margin-bottom: 32px;
        padding: 14px 16px;
      }

      nav h1 {
        font-size: 0.68rem;
      }

      .nav-li a {
        padding: 6px 8px;
      }

      .game-heading {
        align-items: start;
        flex-direction: column;
        gap: 12px;
      }

      .game-heading h2 {
        font-size: 2rem;
      }

      .scoreboard {
        justify-content: space-between;
        gap: 12px;
        padding: 16px;
      }

      .stat-value {
        font-size: 1rem;
      }

      .board {
        height: 260px;
      }

      .game-footer {
        padding: 12px 16px;
      }
    }
  </style>
  <!-- 	<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script> -->
</head>

<body>
  <div id="all-contents">
    <nav>
      <h1>Khi's Amazing Website Corner</h1>
      <ul id="nav-ul">
        <li class="nav-li"><a href="../../index.html">Home</a></li>
        <li class="nav-li"><a href="../../portfolio.html">Portfolio</a></li>
      </ul>
    </nav>

    <main>
      <section class="game-heading">
        <h2>Bouncing Box</h2>
        <p>Click the moving box to score. Each catch sends it back to the start and makes it faster.</p>
      </section>

      <section class="game-panel" aria-label="Bouncing Box game">
        <div class="scoreboard" aria-live="polite">
          <div>
            <span class="stat-label">Score</span>
            <span class="stat-value" id="score">0</span>
          </div>
          <div>
            <span class="stat-label">Speed</span>
            <span class="stat-value"><span id="speed-value">10</span> px / tick</span>
          </div>
        </div>
        <div class="board" role="group" aria-label="Game board">
          <button class="box" type="button" aria-label="Catch the bouncing box. Current score: 0">0</button>
        </div>
        <p class="game-footer">The box moves every 50 milliseconds. Keep clicking to see how fast you can make it go.
        </p>
      </section>
    </main>
  </div>

  <script>
    (function () {
      "use strict";
      /* global jQuery */

      //////////////////////////////////////////////////////////////////
      /////////////////// SETUP DO NOT DELETE //////////////////////////
      //////////////////////////////////////////////////////////////////

      var box = jQuery(".box");
      var board = jQuery(".board");
      var scoreDisplay = jQuery("#score");
      var speedDisplay = jQuery("#speed-value");
      var boardWidth = Math.max(0, board.width() - box.outerWidth());
      var boardHeight = Math.max(0, board.height() - box.outerHeight());
      var positionX = 0;
      var positionY = 0;
      var points = 0;
      var speed = 10;
      var directionX = 1;
      var directionY = 0.6;

      // update the boardWidth variable when the window is resized
      jQuery(window).on("resize", function () {
        boardWidth = Math.max(0, board.width() - box.outerWidth());
        boardHeight = Math.max(0, board.height() - box.outerHeight());
        positionX = Math.min(positionX, boardWidth);
        positionY = Math.min(positionY, boardHeight);
        moveBoxTo(positionX);
        moveBoxVerticallyTo(positionY);
      });

      // Every 50 milliseconds, call the update Function (see below)
      setInterval(update, 50);

      // Every time the box is clicked, call the handleBoxClick Function (see below)
      box.on("click", handleBoxClick);

      // moves the Box to a new position on the screen along the X-Axis
      function moveBoxTo(newPositionX) {
        box.css("left", newPositionX);
      }

      function moveBoxVerticallyTo(newPositionY) {
        box.css("top", newPositionY);
      }

      // changes the text displayed on the Box
      function changeBoxText(newText) {
        box.text(newText);
      }

      //////////////////////////////////////////////////////////////////
      /////////////////// YOUR CODE BELOW HERE /////////////////////////
      //////////////////////////////////////////////////////////////////

      // TODO 2 - Variable declarations





      /**
       * This Function will be called 20 times/second.
       * Each time it is called, it should move the Box to a new location.
       * If the box drifts off the screen, turn it around!
       */
      function update() {
        positionX += speed * directionX;
        positionY += speed * directionY;

        if (positionX >= boardWidth) {
          positionX = boardWidth;
          directionX = -1;
        } else if (positionX <= 0) {
          positionX = 0;
          directionX = 1;
        }

        if (positionY >= boardHeight) {
          positionY = boardHeight;
          directionY = -Math.abs(directionY);
        } else if (positionY <= 0) {
          positionY = 0;
          directionY = Math.abs(directionY);
        }

        moveBoxTo(positionX);
        moveBoxVerticallyTo(positionY);
      }

      /**
       * This Function will be called each time the box is clicked.
       * Each time it is called, it should perform each of the following actions:
       * - increase the points total
       * - increase the speed
       * - move the box to the left side of the screen.
       */
      function handleBoxClick() {
        positionX = 0;
        positionY = 0;
        directionX = 1;
        directionY = 0.6;
        points += 1;
        speed = 3 * points + 10;

        moveBoxTo(positionX);
        moveBoxVerticallyTo(positionY);
        changeBoxText(points);
        box.attr("aria-label", "Catch the bouncing box. Current score: " + points);
        scoreDisplay.text(points);
        speedDisplay.text(speed);
      }



    })();
  </script>
</body>

</html>
